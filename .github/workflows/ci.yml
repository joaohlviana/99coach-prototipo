name: testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sintaxe de todos os scripts do app
        run: |
          for f in public/js/*.js public/js/*/*.js; do node -e "new Function(require('fs').readFileSync('$f','utf8'))" || { echo "erro em $f"; exit 1; }; done
      - name: Build (usa o catálogo já versionado; não acessa o banco)
        run: npm run build
      - name: Navegador para os roteiros
        run: npm i --no-save playwright && npx playwright install --with-deps chromium
      - name: Roteiros (servidor simulado com as recusas do banco real)
        run: |
          npm start > /tmp/servidor.log 2>&1 &
          for i in $(seq 1 30); do curl -s -o /dev/null http://localhost:5173/ && break; sleep 1; done
          PW="$(node -e "console.log(require.resolve('playwright'))")" npm test
